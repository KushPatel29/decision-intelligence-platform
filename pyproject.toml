[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-intelligence-platform"
version = "1.1.0"
description = "Customer, pricing and transportation decision intelligence: causal targeting, certified optimization, truth-scored evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.14", "scikit-learn>=1.5", "duckdb>=1.1", "pyarrow>=17", "joblib>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15", "httpx>=0.27", "pyyaml>=6"]
tracking = ["mlflow>=3"]
gurobi = ["gurobipy>=12"]
spark = ["pyspark==4.0.1", "delta-spark==4.0.0", "deltalake>=1.6"]
aws = ["boto3>=1.35", "sagemaker>=2.230,<3"]
app = ["streamlit>=1.50", "plotly>=6", "Authlib>=1.3.2,<2"]
api = ["fastapi>=0.110", "uvicorn>=0.30"]
ml = ["xgboost>=2.0"]
advanced = ["shap>=0.48", "lifetimes>=0.11", "reportlab>=4"]

[project.scripts]
decision-platform = "decision_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["outputs", "data", "release", "tmp", "mlruns", "runtime"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"databricks/notebooks/*.py" = ["F821", "E402"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
