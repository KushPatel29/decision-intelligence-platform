<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corridor | Decision intelligence</title>
<style>
:root{--ink:#eef8ff;--blue:#9399ff;--teal:#4bdcd5;--paper:#081522;--white:#102437;--amber:#ffc773;--line:#233c52;--muted:#a9bfce}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Bahnschrift","Segoe UI",sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #a95600;outline-offset:3px}header{background:#102437;color:white;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:27px;font-weight:650;letter-spacing:-.7px}.brand small{font-size:13px;font-weight:400;margin-left:20px;letter-spacing:0}.environment{padding:5px 11px;background:#315165;border-radius:4px;font-size:13px}.shell{max-width:1550px;margin:auto;display:grid;grid-template-columns:205px 1fr;min-height:90vh}aside{padding:30px 16px;border-right:1px solid var(--line)}nav{position:sticky;top:20px;display:grid;gap:7px}nav button{text-align:left;background:none;border:0;color:var(--muted);padding:11px 14px;border-radius:4px}nav button[aria-selected=true]{background:var(--teal);color:#081522;font-weight:600}.navnote{font-size:12px;color:var(--muted);padding:20px 14px}main{min-width:0;padding:30px 36px 50px}h1{font-size:34px;font-weight:650;letter-spacing:-1px;line-height:1.2;margin:0 0 12px}h2{font-size:21px;line-height:1.3;font-weight:600;margin:0 0 15px}h3{font-size:16px;margin:12px 0}p{max-width:78ch;margin:8px 0 18px}.lead{color:var(--muted);font-size:16px}.notice{border-left:4px solid var(--amber);padding:12px 18px;background:#352c21;margin:20px 0;font-size:14px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:26px 0}.metric{padding:17px 0;border-top:3px solid var(--teal)}.metric strong{font-size:29px;display:block;font-weight:650;letter-spacing:-.7px}.metric span{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;margin-top:24px}.panel{background:var(--white);padding:24px;border-radius:7px;box-shadow:0 2px 5px #16374a08;min-width:0}.wide{margin-top:24px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;font-weight:600;color:var(--muted);padding:12px 9px;border-bottom:2px solid var(--line);white-space:nowrap}td{padding:11px 9px;border-bottom:1px solid var(--line)}tbody tr:hover{background:#16364a}.right{text-align:right}.status{color:var(--teal);font-weight:600}.warning{color:var(--amber)}.subtle{color:var(--muted);font-size:13px}.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:20px 0}select{background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 10px}a{color:var(--blue);text-underline-offset:3px}.download{border:1px solid var(--line);background:var(--white);border-radius:4px;padding:7px 13px;text-decoration:none}.route{display:flex;align-items:flex-start;gap:0;position:relative;padding:38px 0 14px}.route:before{content:"";position:absolute;background:var(--teal);height:7px;top:50px;left:7%;right:7%}.stop{flex:1;text-align:center;position:relative;z-index:1;min-width:0}.stop:before{content:"";display:block;width:23px;height:23px;background:var(--white);border:5px solid var(--teal);border-radius:50%;margin:4px auto 13px}.stop strong{font-size:12px;display:block}.stop span{display:block;color:var(--muted);font-size:12px}.meter{height:9px;background:var(--line);border-radius:4px;overflow:hidden;width:100px}.meter i{display:block;height:100%;background:var(--teal)}.legend{display:flex;gap:20px;font-size:12px;color:var(--muted);margin-bottom:15px}.legend i{display:inline-block;width:9px;height:9px;background:var(--teal);margin-right:5px}.legend i.blue{background:var(--blue)}svg{width:100%;height:auto}.empty{padding:30px;color:var(--muted)}footer{font-size:12px;color:var(--muted);margin-top:30px}.formula{padding:18px;background:var(--paper);border-radius:5px}.pricebuttons{display:flex;gap:8px;flex-wrap:wrap}.pricebuttons button{border:1px solid var(--line);background:var(--white);padding:9px 13px;border-radius:4px;color:var(--ink)}.pricebuttons button[aria-pressed=true]{background:var(--blue);color:white}details{margin-top:16px}summary{cursor:pointer;color:var(--blue)}pre{overflow:auto;font-size:12px;background:var(--paper);padding:15px}.barrow{display:grid;grid-template-columns:105px 1fr 65px;align-items:center;gap:12px;font-size:13px;margin:14px 0}.bar{height:12px;background:var(--line);border-radius:3px}.bar i{display:block;background:var(--teal);height:12px;border-radius:3px}
@media(max-width:1100px){.shell{grid-template-columns:165px 1fr}main{padding:26px 24px}.metrics{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.brand small{display:none}}
@media(max-width:700px){header{padding:16px 18px}.shell{display:block}aside{padding:10px;border-right:0;border-bottom:1px solid var(--line)}nav{position:static;display:flex;overflow-x:auto;gap:3px}nav button{white-space:nowrap;font-size:13px;padding:9px}.navnote{display:none}main{padding:24px 16px}h1{font-size:28px}.panel{padding:18px}.metrics{gap:14px}.metric strong{font-size:25px}.route{overflow-x:auto;min-width:450px}.environment{font-size:11px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header><div class="brand">Corridor <small>Customer, pricing & transportation intelligence</small></div><div class="environment">Synthetic portfolio simulation</div></header>
<div class="shell"><aside><nav role="tablist" aria-label="Decision areas" id="navigation"></nav><div class="navnote">Decision window<br>1–30 October 2025<br><br>Public context. Synthetic customers, rates and road zones.</div></aside><main id="content" aria-live="polite"></main></div>
<script id="data" type="application/json">__DASHBOARD_DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);
const fmt=(n,d=0)=>Number(n).toLocaleString('en-CA',{maximumFractionDigits:d,minimumFractionDigits:d});
const money=n=>'$'+fmt(n,2);const pct=n=>fmt(n*100,1)+'%';
const escape=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const zone=id=>D.zones.find(z=>z.zone_id===id)?.zone_name||id;
function metric(value,label){return `<div class="metric"><strong>${value}</strong><span>${label}</span></div>`}
function table(columns,rows){return `<div class="scroll"><table><thead><tr>${columns.map(c=>`<th>${escape(c[0])}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${columns.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${columns.length}" class="empty">No matching records.</td></tr>`}</tbody></table></div>`}
function bars(rows,key,label){const max=Math.max(...rows.map(r=>r[key]),1);return rows.map(r=>`<div class="barrow"><span>${escape(r[label])}</span><div class="bar"><i style="width:${100*r[key]/max}%"></i></div><span class="right">${fmt(r[key])}</span></div>`).join('')}
function monthlyChart(){const rows=D.monthly.slice(-12),max=Math.max(...rows.map(r=>r.trips)),w=620,h=245;return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Simulated monthly trips over the last twelve months">${rows.map((r,i)=>{const x=35+i*47,y=190-r.trips/max*145;return `<rect x="${x}" y="${y}" width="29" height="${190-y}" rx="3" fill="#006d77"><title>${r.month}: ${fmt(r.trips)} trips</title></rect><text x="${x+14}" y="213" text-anchor="middle" font-size="10" fill="#526d7e">${r.month.slice(5)}</text>`}).join('')}<text x="35" y="235" font-size="11" fill="#526d7e">2025 month</text></svg>`}
const pages=['Decision centre','Customer intelligence','Pricing','Promotions','Loyalty','Transportation','Experiments','Model operations'];let active=0;
function shell(title,lead,body){$('content').innerHTML=`<h1>${title}</h1><p class="lead">${lead}</p>${body}<footer>All financial and customer outcomes are simulated. Estimates describe a proposed campaign; actual policy impact requires a new randomized test. No affiliation with 407 ETR.</footer>`}
function render(index){active=index;document.querySelectorAll('nav button').forEach((b,i)=>b.setAttribute('aria-selected',String(i===index)));const s=D.summary,o=D.optimization.combined;
if(index===0){shell('A campaign that fits the corridor','Review expected customer value, incentive cost and roadway headroom before selecting an offer.',`<div class="metrics">${metric(fmt(o.incremental_trips,1),'Expected additional trips')}${metric(money(o.net_contribution),'Expected net contribution')}${metric(money(o.spend),'Expected incentive costs')}${metric(fmt(o.contacts),'Selected customer contacts')}</div><section class="panel"><h2>Roadway headroom</h2><div class="scroll"><div class="route">${D.zones.map(z=>{const cells=D.capacity.filter(c=>c.zone_id===z.zone_id);const util=cells.reduce((a,c)=>a+c.baseline_forecast+c.allocated_trips,0)/cells.reduce((a,c)=>a+c.capacity_trips,0);return `<div class="stop"><strong>${escape(z.zone_name)}</strong><span>${pct(util)} forecast use</span></div>`}).join('')}</div></div><p class="subtle">Six illustrative travel zones. Capacity includes a 20% forecast safety reserve; these are invented engineering limits.</p></section><div class="layout"><section class="panel"><h2>Historical trip activity</h2>${monthlyChart()}<p class="subtle">${fmt(s.trips)} generated trips across 2024–2025.</p></section><section class="panel"><h2>Decision checks</h2>${table([['Constraint',r=>r.name],['Result',r=>`<span class="status">${r.result}</span>`]],[{name:'Campaign budget',result:money(o.spend)+' / '+money(o.budget)},{name:'One contact per customer',result:'Passed'},{name:'Account and marketing eligibility',result:'Passed'},{name:'Inventory and roadway capacity',result:'Passed'},{name:'Optimization engine',result:escape(s.solver)}])}<p class="subtle">${escape(D.optimization.scope)}</p></section></div><div class="notice">Synthetic forecast benefits. All three offers use dedicated randomized groups; the optimized policy still requires an independent rollout experiment.</div>`)}
if(index===1){shell('Know who is changing their travel','Historical behaviour gives each customer a segment, travel likelihood, inactivity risk and value estimate.',`<div class="metrics">${metric(fmt(s.customers),'Synthetic customers')}${metric(fmt(D.customers.filter(c=>c.churn_probability>.5).length),'Active-history customers at >50% inactivity risk')}${metric(money(D.customers.reduce((a,c)=>a+c.clv_12m,0)/s.customers),'Average projected 12-month value')}${metric(fmt(D.metrics.customer.anomaly.flagged),'Accounts flagged for review')}</div><div class="layout"><section class="panel"><h2>Customer segments</h2>${bars(D.segments,'customers','rfm_segment')}</section><section class="panel"><h2>Segment intelligence</h2>${table([['Segment',r=>escape(r.rfm_segment)],['Value',r=>money(r.clv)],['Travel likelihood',r=>pct(r.propensity)],['Inactivity risk',r=>r.churn===null?'—':pct(r.churn)]],D.segments)}</section></div><section class="panel wide"><div class="toolbar"><h2 style="margin:0">Customer workbench</h2><label for="segment">Segment</label><select id="segment"><option value="all">All segments</option>${D.segments.map(s=>`<option>${escape(s.rfm_segment)}</option>`).join('')}</select><a class="download" href="customer_360.csv" download>Export all customers</a></div><div id="customers"></div><p class="subtle">First 100 matching records. Inactivity and attrition scores are blank for customers without three trips in the preceding 90 days.</p></section>`);$('segment').onchange=customerRows;customerRows()}
if(index===2){shell('Explore effective customer prices','Change the simulated effective price and inspect the estimated demand and revenue response.',`<div class="toolbar"><label for="priceZone">Zone</label><select id="priceZone">${D.zones.map(z=>`<option value="${z.zone_id}">${escape(z.zone_name)}</option>`).join('')}</select><label for="pricePeriod">Travel period</label><select id="pricePeriod"><option>Off-peak</option><option>Weekend</option><option>Peak</option></select></div><section class="panel"><h2>Price scenario</h2><div class="pricebuttons" id="changes">${[-.3,-.2,-.1,0,.05,.1].map(v=>`<button data-change="${v}" aria-pressed="${v===0}">${v===0?'Baseline':(v>0?'+':'')+fmt(v*100)+'%'}</button>`).join('')}</div><div id="priceResult"></div><p class="subtle">Index 100 equals the baseline. Coefficients are fitted to independent randomized price assignments in a separate synthetic pricing panel, not to actual toll transactions. This isolates price effects for an educational demonstration.</p></section><section class="panel wide"><h2>All price scenarios</h2><div id="scenarioTable"></div></section>`);$('priceZone').onchange=priceRows;$('pricePeriod').onchange=priceRows;document.querySelectorAll('#changes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#changes button').forEach(q=>q.setAttribute('aria-pressed',q===b));priceRows()});priceRows()}
if(index===3){allocationPage('Promotion recommendations','Expected additional trips are valued after paying discounts on both existing and additional travel.',D.decisions.filter(d=>d.offer_id!=='loyalty_500'),'promotion_allocation.csv',D.optimization.promotion)}
if(index===4){allocationPage('Loyalty reward allocation','Rewards compete with promotions in one joint optimization under shared budget, contact, points and roadway limits.',D.decisions.filter(d=>d.offer_id==='loyalty_500'),'loyalty_allocation.csv',D.optimization.loyalty);$('content').insertAdjacentHTML('afterbegin','<div class="notice">Loyalty has a dedicated randomized group and redemption model. Full awarded reward liability is reserved before redemption; forecast policy benefits require an independent experiment.</div>')}
if(index===5){shell('Keep travel within available capacity','Expected 30-day traffic is combined with campaign demand and a 20% planning reserve.',`<section class="panel"><h2>Zone and travel period</h2>${table([['Zone',r=>escape(zone(r.zone_id))],['Period',r=>escape(r.period)],['Baseline forecast',r=>fmt(r.baseline_forecast,1)],['Campaign trips',r=>fmt(r.allocated_trips,1)],['Capacity',r=>fmt(r.capacity_trips)],['Expected use',r=>`<div class="meter"><i style="width:${Math.min(100,r.final_utilization*100)}%"></i></div> ${pct(r.final_utilization)}`],['Headroom after reserve',r=>fmt(r.remaining_with_reserve,1)]],D.capacity)}</section><div class="notice">The forecasting test measures rolling next-day predictions. The 30-day allocation forecast uses historical weather averages and known dates, so longer-horizon performance is still to be validated.</div>`)}
if(index===6){const e=D.experiment;shell('Measure the change caused by an offer','A historical randomized simulation compares three offers with a customer-level control group.',`<div class="metrics">${metric(pct(e.control_conversion),'Control travel response')}${metric(fmt(e.required_per_arm),'Planned customers per arm')}${metric(fmt(Math.min(...Object.values(e.actual_per_arm))),'Actual minimum per arm')}${metric(e.powered_for_planned_mde?'Met':'Not met','Planned sample-size requirement')}</div><section class="panel"><h2>Intention-to-treat results</h2>${table([['Treatment',r=>escape(r.arm)],['Customers',r=>fmt(r.n)],['Response',r=>pct(r.conversion)],['Absolute lift',r=>fmt(r.difference*100,2)+' pp'],['Adjusted 95% interval',r=>fmt(r.ci_low*100,2)+' to '+fmt(r.ci_high*100,2)+' pp'],['Adjusted p-value',r=>fmt(r.p_adjusted,4)]],e.results)}<p class="subtle">Three primary comparisons, family alpha 5%; Bonferroni-adjusted intervals and p-values. Assignment-ratio check p=${fmt(e.srm_p_value,4)}.</p></section><div class="notice">${e.powered_for_planned_mde?'The planned sample-size target was met.':'This demonstration is smaller than the planned sample-size target. Do not treat a non-significant result as evidence of no effect.'} Model uplift and campaign forecasts need a separate policy experiment before rollout.</div><section class="panel wide"><h2>Causal-model held-out evaluation</h2>${table([['Offer',r=>r.name],['T-learner Qini',r=>fmt(r.t,4)],['S-learner Qini',r=>fmt(r.s,4)],['Test customers',r=>fmt(r.n)]],['offpeak_15','weekend_20','loyalty_500'].map(k=>({name:k,t:D.metrics.uplift[k].t_learner.qini,s:D.metrics.uplift[k].s_learner.qini,n:D.metrics.uplift[k].n_test})))}</section>`)}
if(index===7){shell('Follow model evidence and drift','Model quality comes from held-out periods or held-out customers. Seasonal drift signals need business review.',`<section class="panel"><h2>Predictive model evaluation</h2>${table([['Model',r=>r.name],['AUC',r=>fmt(r.m.roc_auc,3)],['PR-AUC',r=>fmt(r.m.pr_auc,3)],['Brier score',r=>fmt(r.m.brier,3)],['Top 10% lift',r=>fmt(r.m.lift_at_10,2)+'×'],['Test customers',r=>fmt(r.m.n)]],['propensity','churn','attrition'].map(k=>({name:k,m:D.metrics.customer[k].test_calibrated})))}<p class="subtle">Train: July 2024–January 2025. Validate and calibrate: April 2025. Test: July 2025. Forward 90-day labels are purged between folds.</p></section><div class="layout"><section class="panel"><h2>Demand forecasting</h2><p>Held-out mean absolute error: <strong>${fmt(D.metrics.demand.test.mae,2)} trips per zone and period per day</strong>.</p><p>Seasonal naive baseline: ${fmt(D.metrics.demand.test.seasonal_naive_mae,2)}.</p><p class="subtle">Includes prior demand, known calendar, lagged weather and lagged economic context.</p></section><section class="panel"><h2>Delivery status</h2>${table([['Component',r=>r.n],['Status',r=>escape(r.s)]],[{n:'Python / SQL / Gurobi',s:'Executed locally'},{n:'MLflow tracking',s:'Local runs; see tracking artifacts'},{n:'AWS SageMaker',s:'Pipeline compiled; local stages checked; hosted run pending'},{n:'Spark / Delta',s:'1.22 million trips; local benchmark passed'},{n:'Hosted Databricks',s:'Notebook ready; hosted run pending'},{n:'Native Power BI report',s:'8 pages authored; native refresh and live DAX checks passed; all eight pages reviewed'}])}</section></div><section class="panel wide"><h2>Feature drift</h2>${table([['Feature',r=>escape(r.feature)],['PSI',r=>fmt(r.psi,3)],['KS statistic',r=>fmt(r.ks_statistic,3)],['Status',r=>`<span class="${r.status==='Review'?'warning':'status'}">${escape(r.status)}</span>`]],D.monitoring.features)}<p class="subtle">${escape(D.monitoring.interpretation)}</p></section>`)}
}
function customerRows(){let rows=D.customers;const v=$('segment').value;if(v!=='all')rows=rows.filter(c=>c.rfm_segment===v);$('customers').innerHTML=table([['Customer',r=>escape(r.customer_id)],['Segment',r=>escape(r.rfm_segment)],['Trips / 30 days',r=>fmt(r.trips_30d)],['Travel likelihood',r=>pct(r.propensity_probability)],['Inactivity risk',r=>r.churn_probability===null?'—':pct(r.churn_probability)],['12-month value',r=>money(r.clv_12m)]],rows.slice(0,100))}
function priceRows(){const z=Number($('priceZone').value),p=$('pricePeriod').value,change=Number(document.querySelector('#changes button[aria-pressed=true]').dataset.change);const rows=D.scenarios.filter(r=>r.zone_id===z&&r.period===p);const s=rows.find(r=>r.price_change===change);$('priceResult').innerHTML=`<div class="metrics">${metric(fmt(s.elasticity,2),'Estimated price elasticity')}${metric(fmt(s.demand_index,1),'Demand index')}${metric(fmt(s.revenue_index,1),'Revenue index')}${metric((change>0?'+':'')+fmt(change*100)+'%','Effective price change')}</div>`;$('scenarioTable').innerHTML=table([['Price change',r=>(r.price_change>0?'+':'')+fmt(r.price_change*100)+'%'],['Demand index',r=>fmt(r.demand_index,1)],['Revenue index',r=>fmt(r.revenue_index,1)]],rows)}
function allocationPage(title,lead,rows,file,status){const cost=rows.reduce((a,r)=>a+r.cost,0),net=rows.reduce((a,r)=>a+r.net_contribution,0),trips=rows.reduce((a,r)=>a+r.incremental_trips,0);shell(title,lead,`<div class="metrics">${metric(fmt(rows.length),'Selected customers')}${metric(money(cost),'Expected incentive costs')}${metric(money(net),'Expected net contribution')}${metric(fmt(trips,1),'Expected additional trips')}</div><section class="panel"><div class="toolbar"><h2 style="margin:0">Allocation table</h2><a class="download" href="${file}" download>Export recommendations</a></div>${table([['Customer',r=>escape(r.customer_id)],['Offer',r=>escape(r.offer_name)],['Zone',r=>escape(zone(r.zone_id))],['Segment',r=>escape(r.rfm_segment)],['Additional trips',r=>fmt(r.incremental_trips,2)],['Cost',r=>money(r.cost)],['Net contribution',r=>money(r.net_contribution)]],rows)}<p class="subtle">${escape(status.solver)}: ${escape(status.status)}. These are expected values; contact limits and eligibility are enforced.</p></section>`)}
$('navigation').innerHTML=pages.map((p,i)=>`<button role="tab" aria-selected="${i===0}" data-page="${i}">${p}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>render(Number(b.dataset.page)));render(0);
</script></body></html>
