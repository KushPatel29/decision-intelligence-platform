# Weekly dependency and action updates. Pull requests run the full CI, including the pipeline
# and every test, before anything merges.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The Databricks job's pins change only with a new hosted run and receipt.
    exclude-paths:
      - "databricks/**"
    ignore:
      # delta-spark 4.0 supports pyspark 4.0 only; the two move together, by hand.
      - dependency-name: pyspark
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # aws/pipeline.py is written against the v2 SDK (Estimator, Processor, Transformer).
      - dependency-name: sagemaker
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
